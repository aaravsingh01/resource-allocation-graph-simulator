<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Allocation Graph Simulator</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <h1>Resource Allocation Graph Simulator</h1>
        <div id="graph-container"></div>
        <div class="controls">
            <button id="add-process">Add Process</button>
            <button id="add-resource">Add Resource</button>
            <select id="link-type">
                <option value="assignment">Assignment</option>
                <option value="request">Request</option>
            </select>
            <button id="clear-graph">Clear Graph</button>
            <button id="detect-deadlock">Detect Deadlock</button>
        </div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="assets/script.js" defer></script>
</body>
</html>
